<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Co-Pilot — AI research assistant for literature review &amp; paper drafting</title>
    <meta
      name="description"
      content="Academic Co-Pilot is an AI research assistant that guides you from a research goal to a finished draft: screen literature, ingest PDFs, plan and draft papers with real citations (IEEE, APA, Vancouver), and analyse your data. Pay as you go — no subscription."
    />
    <meta
      name="keywords"
      content="AI research assistant, academic writing AI, literature review tool, systematic review screening, paper drafting with citations, RAG for research papers, thesis writing assistant, data analysis for researchers"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Academic Co-Pilot" />
    <meta name="application-name" content="Academic Co-Pilot" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social previews. Set og:url + og:image to absolute URLs
         once the production domain is fixed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Academic Co-Pilot" />
    <meta property="og:title" content="Academic Co-Pilot — from research goal to finished draft" />
    <meta
      property="og:description"
      content="Guided AI workflows for researchers: literature screening, PDF ingestion, paper planning, drafting with citations and data analysis. Pay as you go."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fa_IR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Academic Co-Pilot — from research goal to finished draft" />
    <meta
      name="twitter:description"
      content="Guided AI workflows for researchers: literature screening, PDF ingestion, paper planning, drafting with citations and data analysis."
    />

    <!-- Structured data: lets search engines show the app as a product. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Academic Co-Pilot",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "inLanguage": ["en", "fa"],
        "description": "AI research assistant that screens literature, ingests PDFs, plans and drafts papers with citations, and analyses research data.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free starter credit, then pay as you go."
        },
        "featureList": [
          "Literature screening from CSV exports",
          "PDF ingestion into a searchable knowledge base",
          "Paper planning: titles, outline and sections",
          "Section-by-section drafting with IEEE, APA or Vancouver citations",
          "Sandboxed data analysis with charts",
          "English and Persian interface"
        ]
      }
    </script>
    <!--
      Crimson Pro   — display serif for wizard headings (academic register)
      Atkinson Hyperlegible — body face, designed for legibility
      Vazirmatn     — Persian face, used when <html dir="rtl">
      Preconnect first so the render-blocking stylesheet resolves quickly.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600;700&family=Vazirmatn:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Academic Co-Pilot — AI research assistant</h1>
      <p>
        Guided workflows that take you from a research goal to a finished draft:
        literature screening, PDF ingestion, paper planning, drafting with
        citations and data analysis. Please enable JavaScript to use the app.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
